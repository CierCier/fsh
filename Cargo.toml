[workspace]
members = ["bin/fsh", "bin/fshd", "bin/fcp", "crates/fsh-core"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
ed25519-dalek = { version = "2.2", features = ["rand_core", "pem", "pkcs8"] }
rand = "0.9"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
rcgen = "0.14"
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
quinn = "0.11"
quinn-proto = { package = "quinn-proto", version = "0.11", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
signature = "2.2"
ssh-key = { version = "0.6", features = ["ed25519", "ecdsa", "rsa", "encryption"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x509-parser = "0.18"
